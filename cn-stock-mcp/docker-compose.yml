version: "3.8"

services:
  cn-stock-mcp:
    build: .
    ports:
      - "7070:7070"
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7070/sse')"]
      interval: 30s
      timeout: 10s
      retries: 3
